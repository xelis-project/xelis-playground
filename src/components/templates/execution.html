<section id="contract_container" class="tool-panel">
 <div id="configuration_container">
  <div id="program-spec">
    <section class="inspector-card">
      <div class="card-heading"><span class="step-number">01</span><h3>Entry point</h3><span class="tag">Local VM</span></div>
      <p class="card-description">Compile your source, then choose a function to run.</p>
      <div class="entry-picker"><div class="dropdown">
                      <div class="menu-stat-ro">
                        <span id="hud-entry-name" class="menu-item-name" >Compile to select an entry</span>
                      </div>
                      <div id="entry-menu" class="dropdown-content"></div>
                    </div></div>
    </section>
    <section id="parameter-display" class="inspector-card">
      <div class="card-heading"><span class="step-number">02</span><h3>Arguments</h3></div>
      <div id="pba-readonly" class="pb-arguments-container readonly">
                  <div>
                    <div class="message hide">This entry has no parameters.</div>
                    <div id="entry-call-container"></div>
                    <div id="signature-container" class="hide code"></div>
                  </div>
                  <div class="pb-arg-btns">
                    <div class="left-icons">
                      <button id="btn-reuse-last-call" class="icon-button with-tooltip"
                        data-tooltip="Disable call reuse" data-toggle="on" disabled></button>
                      <button id="btn-call-history" class="icon-button with-tooltip"
                        data-tooltip="Contract call history" disabled></button>
                      <button id="btn_run_constructor" data-toggle="on" disabled class="icon-button with-tooltip"
                        data-tooltip="Run the constructor before executing the entry"></button>
                    </div>
                    <div>
                      <button id="edit-entry-params-btn" data-panel-id="parameter_builder_container"
                        class="opt-btn blue" disabled>Arguments</button>
                      <button id="entry-call-btn" class="opt-btn blue hide" disabled>Entry Call</button>
                      <button id="signature-btn" class="opt-btn blue" disabled>Signature</button>
                      <button id="copy-ec-btn" class="opt-btn blue" disabled>Copy</button>
                    </div>
                  </div>
                </div>
    </section>
    <section class="inspector-card">
      <div class="card-heading"><span class="step-number">03</span><h3>Execution context</h3></div>
      <div class="context-fields">
       <div class="field"><label>Storage preset</label><div class="dropdown">
                      <div class="menu-stat-ro">
                        <span id="hud-storage-preset-map-selected" class="menu-item-name">&nbsp;</span>
                      </div>
                      <div id="hud-storage-preset-map-menu-content" class="dropdown-content"></div>
                    </div></div>
       <div id="gas_limit_display" class="field"><label for="input_max_gas">Gas limit <span class="field-unit">lex</span></label>
        <input id="input_max_gas" type="text" inputmode="numeric" placeholder="Unlimited" aria-describedby="gas-help" />
        <small id="gas-help">Leave empty for an unlimited budget.</small>
       </div>
      </div>
      <button id="btn_configure_deposits" class="opt-btn context-action">Configure asset deposits <span aria-hidden="true">↗</span></button>
    </section>
  </div>
 </div>
 <div class="run-action"><span>Fresh state on every run</span><button id="btn_run" class="primary-button" disabled>Run contract</button></div>
</section>
